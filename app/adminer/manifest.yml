manifestVersion: v1
slugs:
  - adminer
name: Adminer
type: app
description: Adminer is a lightweight database management tool written in PHP, providing a simple and powerful interface for MySQL, PostgreSQL, SQLite, and more.
services:
  - php
mappings:
  - path: /
    matchPattern: begins-with
    targetType: service
    targetValue: php
installCmdSteps:
  - wget "https://github.com/vrana/adminer/releases/download/v5.3.0/adminer-5.3.0.php" -O %installDirectory%/index.php
  - wget "https://raw.githubusercontent.com/vrana/adminer/refs/heads/master/designs/pepa-linha/adminer.css" -O %installDirectory%/adminer.css
  - |
    if [[ -d /etc/postgresql/ ]]; then
      sed -i.backup 's/local.*all.*all.*peer/local all all md5/' /etc/postgresql/*/main/pg_hba.conf
      os services update --name postgresql --status restart
      os runtime php update-module --hostname %installHostname% --name pgsql --version 7.4 --status true
      os services update --name php --status restart
    else
      os services update --name php --status restart
    fi
uninstallFileNames:
  - adminer.css
  - index.php
installTimeoutSecs: 300
estimatedSizeBytes: 512000
avatarUrl: https://goinfinite.github.io/os-marketplace/app/adminer/assets/avatar.png
screenshotUrls:
  - https://goinfinite.github.io/os-marketplace/app/adminer/assets/screenshot-0.png
  - https://goinfinite.github.io/os-marketplace/app/adminer/assets/screenshot-1.png
  - https://goinfinite.github.io/os-marketplace/app/adminer/assets/screenshot-2.png
  - https://goinfinite.github.io/os-marketplace/app/adminer/assets/screenshot-3.png
  - https://goinfinite.github.io/os-marketplace/app/adminer/assets/screenshot-4.png
