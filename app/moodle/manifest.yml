manifestVersion: v1
slugs:
  - moodle
name: Moodle
type: app
description: Moodle is an open-source online learning platform, built in PHP, designed for creating and managing virtual learning environments.
services:
  - mariadb
  - php:8.3
dataFields:
  - name: adminUsername
    label: Admin Username
    type: text
    specificType: username
    isRequired: true
  - name: adminPassword
    label: Admin Password
    type: password
    specificType: password
    isRequired: true
  - name: adminEmail
    label: Admin Email
    type: email
    specificType: email
    isRequired: true
  - name: fullName
    label: Site Full Name
    type: text
    isRequired: true
  - name: shortName
    label: Site Short Name
    type: text
    isRequired: true
installCmdSteps:
  - cp -u %marketplaceCatalogItemAssetsDirPath%/.htaccess %installDirectory%/
  - wget -q https://download.moodle.org/download.php/direct/stable405/moodle-latest-405.tgz -O %installTempDir%/moodle.tgz
  - cd %installTempDir% && tar -xzf moodle.tgz
  - shopt -s dotglob && mv %installTempDir%/moodle/* %installDirectory% && shopt -u dotglob
  - mkdir /app/%installHostname%-moodledata
  - os runtime php update --hostname %installHostname% --version 8.3
  - os runtime php update-setting --hostname %installHostname% --version 8.3 --name max_input_vars --value 7200
  - sed -i 's/uca1400_ai_ci/general_ci/' /etc/mysql/mariadb.conf.d/50-server.cnf
  - os services update --name mariadb --status restart
  - os db create --db-type mysql --db-name 'moodle_%installUuid%'
  - os db create-user --db-type mysql --db-name 'moodle_%installUuid%' --username 'moodle_%installUuid%' --password '%installRandomPassword%' --privileges all
  - php -d max_input_vars=5000 %installDirectory%/admin/cli/install.php --chmod=755 --wwwroot=https://%installHostname% --dataroot=/app/%installHostname%-moodledata --dbtype=mariadb --dbname=moodle_%installUuid% --dbuser=moodle_%installUuid% --dbpass='%installRandomPassword%' --dbport=3306 --fullname='%fullName%' --shortname='%shortName%' --adminuser='%adminUsername%' --adminpass='%adminPassword%' --adminemail=%adminEmail% --non-interactive --agree-license
  - echo -e '\n$CFG->routerconfigured = true;\n' >>%installDirectory%/config.php
  - os cron create -s "* * * * *" -d "MoodleCron" -c "php %installDirectory%/admin/cli/cron.php"
  - os vhost mapping create --hostname %installHostname% --path %installUrlPath% --type service --value php
  - sleep 120 && chown -Rc nobody:nogroup /app/%installHostname%-moodledata/
uninstallCmdSteps:
  - mkdir -p /app/.trash/moodle-%installHostname%-%installUuid%
  - shopt -s dotglob && mv %installDirectory%/* /app/%installHostname%-moodledata/ /app/.trash/moodle-%installHostname%-%installUuid%/ && shopt -u dotglob
  - install_packages -qq jq
  - mappingId=$(os vhost mapping get | jq '.body.virtualHostWithMappings[] | select(.hostname == "%installHostname%") | .mappings[] | select(.path == "%installUrlPath%") | .id') && os vhost mapping delete --id ${mappingId}
  - os db delete-user --db-type mysql --db-name 'moodle_%installUuid%' --db-username 'moodle_%installUuid%'
  - os db delete --db-type mysql --db-name 'moodle_%installUuid%'
  - os cron delete -d "MoodleCron"
  - apt -qqy remove jq && apt -qqy autoremove
installTimeoutSecs: 900
estimatedSizeBytes: 372349285
avatarUrl: https://raw.githubusercontent.com/goinfinite/os-marketplace/refs/heads/v1/app/moodle/assets/avatar.png
screenshotUrls:
  - https://raw.githubusercontent.com/goinfinite/os-marketplace/refs/heads/v1/app/moodle/assets/screenshot-1.png
  - https://raw.githubusercontent.com/goinfinite/os-marketplace/refs/heads/v1/app/moodle/assets/screenshot-2.png
  - https://raw.githubusercontent.com/goinfinite/os-marketplace/refs/heads/v1/app/moodle/assets/screenshot-3.png
