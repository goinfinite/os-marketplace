manifestVersion: v1
id: 8
slugs:
  - moodle
name: Moodle
type: app
description: Moodle is an open-source online learning platform, built in PHP, designed for creating and managing virtual learning environments.
services:
  - mariadb
  - php:8.3
mappings:
  - path: /
    matchPattern: begins-with
    targetType: service
    targetValue: php
dataFields:
  - name: adminUsername
    label: Admin Username
    type: text
    specificType: username
    isRequired: true
  - name: adminPassword
    label: Admin Password
    type: password
    specificType: password
    isRequired: true
  - name: adminEmail
    label: Admin Email
    type: email
    specificType: email
    isRequired: true
  - name: siteFullName
    label: Site Full Name
    type: text
    defaultValue: Moodle Learning Platform
    isRequired: true
  - name: siteShortName
    label: Site Short Name
    type: text
    defaultValue: Moodle
    isRequired: true
installCmdSteps:
  - wget -q -S https://github.com/moodle/moodle/archive/344232c15336c71b80f9aca8359ce0e0a9f3d116.tar.gz -O %installTempDir%/moodle.tgz
  - |
    cd %installTempDir%
    expectedArchiveSha256="ad2d1d4200551531b18e5996bb49730aa9d1e5bbadfa5b86233d48d29470b40a"
    actualArchiveSha256="$(sha256sum moodle.tgz | awk '{ print $1 }')"
    if [ "$actualArchiveSha256" != "$expectedArchiveSha256" ]; then echo "MoodleArchiveDigestMismatch expected=$expectedArchiveSha256 actual=$actualArchiveSha256"; exit 1; fi
  - cd %installTempDir% && mkdir moodle && tar -xzf moodle.tgz --strip-components=1 -C moodle
  - rm -fr %installDirectory% && mv %installTempDir%/moodle /app/moodle_%installUuid% && chown -R nobody:nogroup /app/moodle_%installUuid%
  - cp -u %marketplaceCatalogItemAssetsDirPath%/.htaccess /app/moodle_%installUuid%/public/
  - ln -s /app/moodle_%installUuid%/public %installDirectory%
  - os runtime php update --hostname %installHostname% --version 8.3
  - os runtime php update-setting --hostname %installHostname% --version 8.3 --name max_input_vars --value 7200
  - sed -i 's/uca1400_ai_ci/general_ci/' /etc/mysql/mariadb.conf.d/50-server.cnf
  - os services update --name mariadb --status restart
  - os db create --db-type mysql --db-name moodle_%installUuid%
  - os db create-user --db-type mysql --db-name moodle_%installUuid% --username moodle_%installUuid% --password '%installRandomPassword%' --privileges all
  - mariadb -u'moodle_%installUuid%' -p'%installRandomPassword%' moodle_%installUuid% -e "ALTER DATABASE moodle_%installUuid% CHARACTER SET = utf8mb4 COLLATE = utf8mb4_unicode_ci;"
  - su nobody --shell /bin/bash -c "php -d max_input_vars=5000 /app/moodle_%installUuid%/admin/cli/install.php --chmod=755 --wwwroot='https://%installHostname%%installUrlPath%' --dataroot='/app/%installHostname%-moodledata' --dbtype=mariadb --dbname=moodle_%installUuid% --dbuser=moodle_%installUuid% --dbpass='%installRandomPassword%' --dbport=3306 --fullname='%siteFullName%' --shortname='%siteShortName%' --adminuser='%adminUsername%' --adminpass='%adminPassword%' --adminemail='%adminEmail%' --non-interactive --agree-license"
  - echo -e '\n$CFG->routerconfigured = true;\n' >>/app/moodle_%installUuid%/config.php
  - os cron create --schedule '* * * * *' --comment 'MoodleCron' --command 'su nobody --shell /bin/bash -c "php /app/moodle_%installUuid%/admin/cli/cron.php"'
uninstallCmdSteps:
  - mkdir -p /app/.trash/moodle-%installHostname%-%installUuid%
  - if [ -d /app/moodle_%installUuid% ]; then mv /app/moodle_%installUuid% /app/.trash/moodle-%installHostname%-%installUuid%/; else shopt -s dotglob && mv %installDirectory%/* /app/.trash/moodle-%installHostname%-%installUuid%/ && shopt -u dotglob; fi
  - if [ -d /app/%installHostname%-moodledata ]; then mv /app/%installHostname%-moodledata /app/.trash/moodle-%installHostname%-%installUuid%/; fi
  - if [ -L %installDirectory% ]; then unlink %installDirectory% && mkdir %installDirectory% && chown nobody:nogroup %installDirectory%; fi
  - os db delete-user --db-type mysql --db-name moodle_%installUuid% --db-username moodle_%installUuid%
  - os db delete --db-type mysql --db-name moodle_%installUuid%
  - os cron delete -d 'MoodleCron'
installTimeoutSecs: 900
estimatedSizeBytes: 432272303
avatarUrl: https://goinfinite.github.io/os-marketplace/app/moodle/assets/avatar.png
screenshotUrls:
  - https://goinfinite.github.io/os-marketplace/app/moodle/assets/screenshot-1.png
  - https://goinfinite.github.io/os-marketplace/app/moodle/assets/screenshot-2.png
  - https://goinfinite.github.io/os-marketplace/app/moodle/assets/screenshot-3.png
