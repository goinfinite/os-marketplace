manifestVersion: v1
slugs:
  - passbolt
name: Passbolt
type: app
description: Passbolt is an open source credential platform for modern teams. A versatile, battle-tested solution to manage and collaborate on passwords, accesses, and secrets. All in one.
services:
  - php:8.3
  - mariadb
dataFields:
  - name: adminFirstName
    label: Admin First Name
    type: text
    specificType: username
    isRequired: true
  - name: adminLastName
    label: Admin Last Name
    type: text
    isRequired: true
  - name: adminMailAddress
    label: Admin Email
    type: email
    specificType: email
    isRequired: true
  - name: smtpFrom
    label: SMTP From Address
    type: text
    specificType: email
    isRequired: true
  - name: smtpHost
    label: SMTP Host
    type: text
    isRequired: true
  - name: smtpPort
    label: SMTP Port
    type: text
    isRequired: true
  - name: smtpUsername
    label: SMTP Username
    type: text
    isRequired: true
  - name: smtpPassword
    label: SMTP Password
    type: password
    isRequired: true
installCmdSteps:
  - os vhost mapping create --hostname %installHostname% --path %installUrlPath% --type service --value php-webserver
  - install_packages libgpgme-dev
  - curl -skL -o /app/composer-setup.php https://getcomposer.org/installer
  - php /app/composer-setup.php --install-dir=/usr/local/bin --filename=composer --quiet && rm -f /app/composer-setup.php
  - os runtime php update --hostname %installHostname% --version 8.3
  - for extension in ldap pear; do os runtime php update-module --hostname %installHostname% --name ${extension} --status true --version 8.3; done
  - if [[ ! -f /usr/local/lsws/lsphp83/etc/php/8.3/mods-available/gnupg.ini ]]; then /usr/local/lsws/lsphp83/bin/pecl install gnupg; fi
  - echo "extension=gnupg.so" >>/usr/local/lsws/lsphp83/etc/php/8.3/mods-available/gnupg.ini
  - os services update --name php --status restart
  - os db create --db-type mysql --db-name 'passbolt_%installUuid%'
  - os db create-user --db-type mysql --db-name 'passbolt_%installUuid%' --username 'passbolt_%installUuid%' --password '%installRandomPassword%' --privileges all
  - usermod -d %installDirectory% nobody
  - git config --global --add safe.directory %installDirectory%
  - git clone https://github.com/passbolt/passbolt_api.git %installDirectory%
  - composer install --working-dir %installDirectory% --no-dev --no-interaction --quiet
  - cp -u %marketplaceCatalogItemAssetsDirPath%/passbolt.default.php %installDirectory%/config/passbolt.php
  - chown -R nobody:nogroup %installDirectory%
  - cp -u %marketplaceCatalogItemAssetsDirPath%/gpg-key-template.txt %installTempDir%
  - sed -i 's/name_real/%installHostname%/' %installTempDir%/gpg-key-template.txt
  - sed -i 's/name_email/admin@%installHostname%/' %installTempDir%/gpg-key-template.txt
  - su nobody --shell /bin/bash -c 'gpg --batch --no-tty --gen-key <<<"$(cat %installTempDir%/gpg-key-template.txt)"'
  - su nobody --shell /bin/bash -c "gpg --armor --export-secret-keys admin@%installHostname% >%installDirectory%/config/gpg/serverkey_private.asc"
  - su nobody --shell /bin/bash -c "gpg --armor --export admin@%installHostname% >%installDirectory%/config/gpg/serverkey.asc"
  - sed -i 's/goinfinite.local/%installHostname%/g' %installDirectory%/config/passbolt.php
  - sed -i 's/datasource_username/passbolt_%installUuid%/' %installDirectory%/config/passbolt.php
  - sed -i 's/datasource_password/%installRandomPassword%/' %installDirectory%/config/passbolt.php
  - sed -i 's/datasource_database/passbolt_%installUuid%/' %installDirectory%/config/passbolt.php
  - sed -i 's/smtp_host/%smtpHost%/' %installDirectory%/config/passbolt.php
  - sed -i 's/smtp_port/%smtpPort%/' %installDirectory%/config/passbolt.php
  - sed -i 's/smtp_username/%smtpUsername%/' %installDirectory%/config/passbolt.php
  - sed -i 's/smtp_password/%smtpPassword%/' %installDirectory%/config/passbolt.php
  - sed -i 's/smtp_from/%smtpFrom%/' %installDirectory%/config/passbolt.php
  - pubKey=$(su nobody --shell /bin/bash -c 'gpg --list-keys | grep -oP "[[:xdigit:]]{40}"') && sed -i "s/gpg_fingerprint/${pubKey}/" %installDirectory%/config/passbolt.php
  - su nobody --shell /bin/bash -c "bash %installDirectory%/bin/cake passbolt create_jwt_keys --quiet"
  - chmod 500 %installDirectory%/config/jwt/
  - su nobody --shell /bin/bash -c "bash %installDirectory%/bin/cake passbolt install --admin-first-name %adminFirstName% --admin-last-name %adminLastName% --admin-username %adminMailAddress%" 2>/dev/null
  - os cron create -s "* * * * *" -d "PassboltCron" -c "su nobody --shell /bin/bash -c 'bash %installDirectory%/bin/cake EmailQueue.sender'"
  - os services update --name php --status restart
uninstallCmdSteps:
  - install_packages -qq jq
  - mappingId=$(os vhost mapping get | jq '.body[] | select(.hostname == "%installHostname%") | .mappings[] | select(.path == "%installUrlPath%") | .id') && os vhost mapping delete --id ${mappingId}
  - os db delete-user --db-type mysql --db-name 'passbolt_%installUuid%' --db-username 'passbolt_%installUuid%'
  - os db delete --db-type mysql --db-name 'passbolt_%installUuid%'
  - os cron delete -d "PassboltCron"
  - apt -qqy remove jq && apt -qqy autoremove
uninstallFileNames:
  - package-lock.json
estimatedSizeBytes: 225409823
avatarUrl: https://goinfinite.github.io/os-marketplace/app/passbolt/assets/avatar.jpg
