manifestVersion: v1
id: 16
slugs:
  - pocketbase
name: PocketBase
type: app
description: PocketBase is an open-source backend solution comprising an embedded SQLite database, built-in auth system, REST API, and admin UI. It provides a single binary deployment for rapid backend development with zero configuration required.
dataFields:
  - name: adminEmail
    label: Admin Email
    type: email
    specificType: email
    isRequired: true
  - name: adminPassword
    label: Admin Password
    type: password
    specificType: password
    isRequired: true
installCmdSteps:
  - |
    cd %installTempDir%
    curl -fsSL https://github.com/pocketbase/pocketbase/releases/download/v0.22.19/pocketbase_0.22.19_linux_amd64.zip -o pocketbase_0.22.19_linux_amd64.zip
    curl -fsSL https://github.com/pocketbase/pocketbase/releases/download/v0.22.19/checksums.txt -o checksums.txt
    grep 'pocketbase_0.22.19_linux_amd64.zip' checksums.txt | sha256sum -c -
    unzip -o %installTempDir%/pocketbase_0.22.19_linux_amd64.zip -d %installDirectory%
  - chmod +x %installDirectory%/pocketbase
  - os services create-custom --type application --name pocketbase-%installUuid% --port-bindings 8090/http --version 0.22.19 --auto-create-mapping true --auto-start true --auto-restart true --start-command "%installDirectory%/pocketbase serve" --mapping-hostname %installHostname% --mapping-path /
  - sleep 5
  - "%installDirectory%/pocketbase admin create '%adminEmail%' '%adminPassword%'"
uninstallCmdSteps:
  - os services get | jq -r '.body.installedServices[] | select(.name | contains("pocketbase")) | select(.portBindings[] | .port == "8090" and .protocol == "http") | .name' | xargs --no-run-if-empty os services delete --name
uninstallFileNames:
  - pocketbase
  - pb_data
  - CHANGELOG.md
  - LICENSE.md
installTimeoutSecs: 300
estimatedSizeBytes: 52428800
avatarUrl: https://goinfinite.github.io/os-marketplace/app/pocketbase/assets/avatar.png
